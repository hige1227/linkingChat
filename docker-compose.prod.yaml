# docker-compose.prod.yaml — Production deployment
# All secrets come from .env.production via env_file
# Usage: cd /opt/linkchat && sudo docker compose -f docker-compose.prod.yaml up -d --build

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - APP_PORT=3008
      - CORS_ORIGINS=https://linkchat-api.matrix-ai.com.cn,http://localhost:5173,http://localhost:5181
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - DEEPSEEK_MODEL=deepseek-chat
      - KIMI_BASE_URL=https://api.moonshot.cn
      - KIMI_MODEL=moonshot-v1-8k
      - FILE_DRIVER=s3
      - AWS_S3_REGION=us-east-1
      - AWS_DEFAULT_S3_BUCKET=linkingchat-files
      - AWS_S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=https://linkchat-minio.matrix-ai.com.cn
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:3008:3008"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3008/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: linkingchat
      POSTGRES_DB: linkingchat
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkingchat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 256m

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.production
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
  miniodata:
