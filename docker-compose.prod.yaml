# docker-compose.prod.yaml — Production deployment
# Usage: docker compose -f docker-compose.prod.yaml --env-file .env.production up -d

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://linkingchat:${DB_PASSWORD}@postgres:5432/linkingchat
      - REDIS_URL=redis://redis:6379
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - MINIO_ENDPOINT=${S3_ENDPOINT:-}
      - MINIO_PORT=${S3_PORT:-443}
      - MINIO_USE_SSL=${S3_USE_SSL:-true}
      - MINIO_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_USER: linkingchat
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: linkingchat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkingchat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
