name: linkingchat

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkingchat-postgres
    environment:
      POSTGRES_USER: linkingchat
      POSTGRES_PASSWORD: linkingchat_dev
      POSTGRES_DB: linkingchat
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkingchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkingchat-redis
    ports:
      - "6387:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: linkingchat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: linkingchat
      MINIO_ROOT_PASSWORD: linkingchat_dev
    ports:
      - "9008:9000"
      - "9009:9001"
    volumes:
      - minio_data:/data

  adminer:
    image: adminer:latest
    container_name: linkingchat-adminer
    ports:
      - "8088:8080"

  maildev:
    image: maildev/maildev
    container_name: linkingchat-maildev
    ports:
      - "1088:1080"
      - "1033:1025"

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: linkingchat-openclaw
    security_opt:
      - no-new-privileges:true
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-lc_dev_token_change_me}
    ports:
      - "127.0.0.1:18790:18789"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:18789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
