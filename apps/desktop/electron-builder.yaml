appId: com.linkingchat.desktop
productName: LinkingChat
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: sidecar/${os}-${arch}
    to: openclaw-sidecar
    filter:
      - '**/*'
      - '!**/*.md'
      - '!**/*.ts'
      - '!**/LICENSE'
      - '!**/.github'
      - '!**/test'
      - '!**/tests'
      - '!**/__tests__'
      - '!**/prebuilds/linux'
      - '!**/prebuilds/darwin'
      - '!**/prebuilds/win32-arm64'
  - from: sidecar/${os}-${arch}/node_modules
    to: openclaw-sidecar/node_modules
    filter:
      - '**/*'
      - '!**/*.md'
      - '!**/*.ts'
      - '!**/LICENSE'
      - '!**/.github'
      - '!**/test'
      - '!**/tests'
      - '!**/__tests__'
      - '!**/prebuilds/linux'
      - '!**/prebuilds/darwin'
      - '!**/prebuilds/win32-arm64'
  - from: resources/hermes-env
    to: hermes-env
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: AppImage
