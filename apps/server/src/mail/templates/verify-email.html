<!DOCTYPE html>
<html>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f5f5f5;">
  <div style="background: white; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h2 style="color: #1976D2; margin-top: 0;">验证您的邮箱</h2>
    <p style="color: #333; font-size: 16px; line-height: 1.5;">欢迎注册 LinkingChat！请使用以下验证码完成邮箱验证：</p>
    <div style="background: #E3F2FD; padding: 24px; text-align: center; border-radius: 8px; margin: 24px 0;">
      <span style="font-size: 36px; font-weight: bold; letter-spacing: 10px; color: #1565C0;">{{code}}</span>
    </div>
    <p style="color: #666; font-size: 14px; line-height: 1.5;">验证码有效期 {{expiresIn}}。如非本人操作，请忽略此邮件。</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 24px 0;" />
    <p style="color: #999; font-size: 12px; margin-bottom: 0;">LinkingChat Team</p>
  </div>
</body>
</html>
