name: linkingchat_mobile
description: LinkingChat mobile app - AI-native social messaging with remote control.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.7.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
